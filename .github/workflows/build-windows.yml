name: Build Windows CUDA

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows x86_64 CUDA (mistralrs)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-cuda-mistralrs
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        id: cuda-toolkit
        with:
          cuda: "12.6.0"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev", "curand", "curand_dev", "visual_studio_integration"]'

      - name: Build (mistralrs + CUDA)
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: "80"
          CUDA_PATH: ${{ steps.cuda-toolkit.outputs.CUDA_PATH }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --no-default-features --features mistralrs,cuda --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: llm-bench-windows-cuda
          path: target/release/llm-bench.exe
          retention-days: 30
